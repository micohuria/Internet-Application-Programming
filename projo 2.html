<!DOCTYPE html>
<html>
    <head>
    <style>body{height:100vh;;align-items:centers;justify-content: center;display:flex;background-color: white};
        
    </style>
    </head>
    <body>
        <button class="rock" onclick="playGame('rock')">rock</button>
        <button class="paper" onclick=" playGame('paper')">paper</button>
        <button class="scissors" onclick="playGame('scissors')">scissors</button>
        <script>
            const score = {
                win: 0,
                lose: 0,
                tie: 0,
            }

            let computerMove = ''

            function pickComputerMove(){
                const randomNumber = Math.random();
            if (randomNumber>=0 && randomNumber<1/3) {
                computerMove = 'rock';
            }else if (randomNumber>=1/3 && randomNumber<2/3) {
                computerMove ='paper';
            }else if(randomNumber>=2/3&& randomNumber<1) {
                computerMove='scissors';
            }
            }
            function playGame(playerMove){
                pickComputerMove();
                let result =''
             if(playerMove==='rock') {
                if (computerMove==='rock') {
                    result = 'tie'
                }else if(computerMove==='paper'){
                    result='win'
                }else if(computerMove==='scissors') {
                    result ='lose'
                }
                }else if (playerMove==='paper') {
              if (computerMove==='paper') {
                    result = 'tie'
                }else if(computerMove==='rock'){
                    result='win'
                }else if(computerMove==='scissors') {
                    result ='lose'
                }  
                }else if (playerMove==='scissors') {
                if (computerMove==='scissors') {
                    result = 'tie'
                }else if(computerMove==='paper'){
                    result='win'
                }else if(computerMove==='rock') {
                    result ='lose'
                }
            }
            if (result === 'win') {
                score.win = score.win+1
            }else if (result ==='lose') {
                score.lose= score.lose +1
            }else if (result === 'tie') {
                score.tie = score.tie +1
            }
        alert(`you picked ${playerMove} the computer picked ${computerMove} . you ${result}
        your score :  wins ${score.win} ,lose ${score.lose} ,tie ${score.tie}`)
        }
            
            

        </script>
    </body>
</html>
